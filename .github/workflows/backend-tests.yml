name: PR4523 focused ownership proof
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: read
jobs:
  focused:
    name: Fresh-start real-store assertions (red2)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container: ghcr.io/kdlbs/kandev-ci:build-latest
    env:
      GOFLAGS: -trimpath
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Record exact source identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/pr4523-proof
          git -c safe.directory="$GITHUB_WORKSPACE" -c core.hooksPath=/dev/null -c core.fsmonitor=false rev-parse HEAD HEAD^{tree} HEAD^ > /tmp/pr4523-proof/git-identity.txt
          git -c safe.directory="$GITHUB_WORKSPACE" -c core.hooksPath=/dev/null -c core.fsmonitor=false ls-tree -r -z HEAD > /tmp/pr4523-proof/source-tree.raw
          go version > /tmp/pr4523-proof/go-version.txt
      - name: Execute assertions with shared positive controls
        working-directory: apps/backend
        shell: bash
        run: |
          set -euo pipefail
          go test -trimpath -tags fts5 -race -p=2 -count=1 -timeout=10m -json ./internal/orchestrator -run '^Test(FreshStartCommit|FreshStartSessionCreated|SessionCreatedWithoutReplacement|RecoverSessionFreshStart)' 2>&1 | tee /tmp/pr4523-proof/assertions.jsonl
      - name: Retain assertion proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr4523-red2-assertions
          path: /tmp/pr4523-proof/
          retention-days: 90
